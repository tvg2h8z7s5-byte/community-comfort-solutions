# /etc/nginx/sites-available/communitycomfortsolutions.org
# (Run certbot afterwards to add HTTPS: sudo certbot --nginx -d communitycomfortsolutions.org -d www.communitycomfortsolutions.org)
server {
    listen 80;
    server_name communitycomfortsolutions.org www.communitycomfortsolutions.org;

    root /var/www/communitycomfortsolutions.org;   # the contents of the site/ folder
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Form backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }
}
